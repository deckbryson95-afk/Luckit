<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luckit - Stats</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #07552f;
    color: #ffffff;
}

body {
    min-height: 100vh;
    padding-bottom: 85px;
}

.clover {
    position: fixed;
    top: -40px;
    font-size: 25px;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes fall {
    from {
        transform: translateY(-50px) rotate(0deg);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

.page {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 35px 25px 50px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
}

.logout-button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #063f24;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.logout-button:hover {
    background: #042f1b;
}

.logout-button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.username {
    margin-top: 7px;
    color: #ccebd9;
    font-size: 15px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: #0b6b3a;
    border-radius: 12px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.08);
}

.stat-title {
    color: #ccebd9;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-value {
    font-size: 30px;
    font-weight: 700;
}

.reward-section {
    background: #0b6b3a;
    border-radius: 12px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.08);
}

.reward-section h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.reward-section p {
    margin: 0;
    color: #ccebd9;
}

.wheel-area {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 30px auto 25px;
}

.wheel {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background:
        conic-gradient(
            from -30deg,
            #167342 0deg 60deg,
            #0d5c35 60deg 120deg,
            #167342 120deg 180deg,
            #0d5c35 180deg 240deg,
            #167342 240deg 300deg,
            #0d5c35 300deg 360deg
        );
    border: 8px solid #ffffff;
    position: relative;
    transition: transform 4s cubic-bezier(0.15, 0.8, 0.15, 1);
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.wheel-label {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100px;
    height: 100px;
    margin-left: -50px;
    margin-top: -50px;
    border-radius: 50%;
    background: #07552f;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    border: 5px solid #ffffff;
    z-index: 2;
}

.reward-text {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 45px;
    left: 0;
    font-weight: 700;
    font-size: 17px;
    pointer-events: none;
}

.reward-text span {
    display: inline-block;
}

.pointer {
    position: absolute;
    z-index: 5;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid #ffffff;
}

.spin-button {
    display: block;
    margin: 0 auto;
    border: none;
    border-radius: 8px;
    padding: 14px 35px;
    background: #07552f;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.spin-button:hover {
    background: #063f24;
}

.spin-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    min-height: 22px;
    margin-top: 15px;
    text-align: center;
    color: #d9f7e4;
    font-size: 14px;
}

.next-reward {
    text-align: center;
    margin-top: 8px;
    color: #ccebd9;
    font-size: 14px;
}

.loading {
    text-align: center;
    padding: 60px 20px;
    font-size: 18px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 75px;
    background: rgba(0, 45, 25, 0.97);
    border-top: 2px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    overflow-x: auto;
    z-index: 9999;
}

.bottom-nav button {
    min-width: 90px;
    height: 68px;
    border: none;
    background: transparent;
    color: white;
    font-size: 21px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.bottom-nav button span {
    font-size: 11px;
    margin-top: 4px;
}

.bottom-nav button:hover:not(:disabled) {
    background: rgba(255,255,255,0.08);
}

.bottom-nav button:disabled {
    opacity: 0.65;
    cursor: default;
}

.bottom-nav .active {
    background: rgba(255,255,255,0.12);
}

@media (max-width: 700px) {
    .page {
        padding: 25px 15px 40px;
    }

    .header {
        align-items: flex-start;
    }

    .header h1 {
        font-size: 28px;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .wheel-area,
    .wheel {
        width: 260px;
        height: 260px;
    }

    .wheel-label {
        width: 88px;
        height: 88px;
        margin-left: -44px;
        margin-top: -44px;
    }

    .bottom-nav button {
        min-width: 82px;
    }
}
</style>
</head>

<body>

<div class="clover" style="left:5%; animation-duration:8s;">🍀</div>
<div class="clover" style="left:15%; animation-duration:11s; animation-delay:2s;">🍀</div>
<div class="clover" style="left:27%; animation-duration:9s; animation-delay:4s;">🍀</div>
<div class="clover" style="left:39%; animation-duration:12s; animation-delay:1s;">🍀</div>
<div class="clover" style="left:52%; animation-duration:10s; animation-delay:3s;">🍀</div>
<div class="clover" style="left:64%; animation-duration:13s; animation-delay:5s;">🍀</div>
<div class="clover" style="left:76%; animation-duration:9s; animation-delay:2s;">🍀</div>
<div class="clover" style="left:88%; animation-duration:11s; animation-delay:4s;">🍀</div>

<div id="loading" class="loading">
    Loading...
</div>

<div id="page" class="page" style="display:none;">

    <div class="header">
        <div>
            <h1>Stats</h1>
            <div id="username" class="username"></div>
        </div>

        <button id="logoutButton" class="logout-button">
            Log Out
        </button>
    </div>

    <div class="stats-grid">

        <div class="stat">
            <div class="stat-title">Tokens</div>
            <div id="tokens" class="stat-value">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Lucks</div>
            <div id="lucks" class="stat-value">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Packs Opened</div>
            <div id="packsOpened" class="stat-value">0</div>
        </div>

    </div>

    <div class="reward-section">

        <h2>Hourly Reward</h2>
        <p>Spin once every hour to receive tokens.</p>

        <div class="wheel-area">

            <div class="pointer"></div>

            <div id="wheel" class="wheel">

                <div class="reward-text">
                    <span>1000</span>
                </div>

                <div class="reward-text" style="transform: rotate(60deg);">
                    <span style="transform: rotate(-60deg);">1200</span>
                </div>

                <div class="reward-text" style="transform: rotate(120deg);">
                    <span style="transform: rotate(-120deg);">1400</span>
                </div>

                <div class="reward-text" style="transform: rotate(180deg);">
                    <span style="transform: rotate(-180deg);">1600</span>
                </div>

                <div class="reward-text" style="transform: rotate(240deg);">
                    <span style="transform: rotate(-240deg);">1800</span>
                </div>

                <div class="reward-text" style="transform: rotate(300deg);">
                    <span style="transform: rotate(-300deg);">2000</span>
                </div>

                <div class="wheel-label">
                    SPIN
                </div>

            </div>
        </div>

        <button id="spinButton" class="spin-button">
            OPEN WHEEL
        </button>

        <div id="message" class="message"></div>
        <div id="nextReward" class="next-reward"></div>

    </div>

</div>

<nav class="bottom-nav">

    <button class="active" onclick="location.href='stats.html'">
        Stats
        <span>Stats</span>
    </button>

    <button onclick="location.href='market.html'">
        Market
        <span>Market</span>
    </button>

    <button disabled>
        Lucks
        <span>Lucks</span>
    </button>

    <button disabled>
        Bazaar
        <span>Bazaar</span>
    </button>

    <button disabled>
        Chat
        <span>Chat</span>
    </button>

    <button disabled>
        Trading
        <span>Trading</span>
    </button>

    <button disabled>
        News
        <span>News</span>
    </button>

    <button disabled>
        Credits
        <span>Credits</span>
    </button>

    <button disabled>
        Settings
        <span>Settings</span>
    </button>

</nav>

<script type="module">

import { supabase } from "./Auth.js";

const loading = document.getElementById("loading");
const page = document.getElementById("page");

const usernameElement =
    document.getElementById("username");

const tokensElement =
    document.getElementById("tokens");

const lucksElement =
    document.getElementById("lucks");

const packsOpenedElement =
    document.getElementById("packsOpened");

const spinButton =
    document.getElementById("spinButton");

const logoutButton =
    document.getElementById("logoutButton");

const wheel =
    document.getElementById("wheel");

const message =
    document.getElementById("message");

const nextReward =
    document.getElementById("nextReward");

const rewards = [
    1000,
    1200,
    1400,
    1600,
    1800,
    2000
];

let currentRotation = 0;
let spinning = false;
let currentUser = null;
let currentProfile = null;
let started = false;

function showMessage(text) {
    message.textContent = text;
}

function formatNumber(value) {
    return Number(value || 0).toLocaleString();
}

function formatTime(ms) {
    const totalSeconds =
        Math.max(0, Math.floor(ms / 1000));

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

async function redirectToLogin() {
    await supabase.auth.signOut({
        scope: "local"
    });

    window.location.replace("login.html");
}

async function checkBanStatus() {
    if (!currentUser) {
        return false;
    }

    const { data, error } =
        await supabase
            .from("profiles")
            .select("is_banned, ban_reason")
            .eq("id", currentUser.id)
            .maybeSingle();

    if (error) {
        return false;
    }

    if (data?.is_banned === true) {
        await supabase.auth.signOut({
            scope: "local"
        });

        const reason =
            encodeURIComponent(
                data.ban_reason ||
                "Your account has been banned."
            );

        window.location.replace(
            `login.html?banned=true&reason=${reason}`
        );

        return true;
    }

    return false;
}

async function loadProfile() {
    if (!currentUser) {
        return false;
    }

    const { data, error } =
        await supabase
            .from("profiles")
            .select(`
                id,
                username,
                tokens,
                lucks,
                packs_opened,
                is_Admin,
                is_banned,
                ban_reason,
                last_hourly_reward
            `)
            .eq("id", currentUser.id)
            .maybeSingle();

    if (error) {
        showMessage(
            "Could not load your profile."
        );

        return false;
    }

    if (!data) {
        showMessage(
            "Profile not found."
        );

        return false;
    }

    if (data.is_banned === true) {
        await checkBanStatus();
        return false;
    }

    currentProfile = data;

    usernameElement.textContent =
        data.username || "Player";

    tokensElement.textContent =
        formatNumber(data.tokens);

    lucksElement.textContent =
        formatNumber(data.lucks);

    packsOpenedElement.textContent =
        formatNumber(data.packs_opened);

    updateRewardTimer(
        data.last_hourly_reward
    );

    return true;
}

function updateRewardTimer(lastReward) {
    if (!lastReward) {
        spinButton.disabled = false;

        nextReward.textContent =
            "Your hourly reward is ready.";

        return;
    }

    const lastTime =
        new Date(lastReward).getTime();

    const nextTime =
        lastTime + 60 * 60 * 1000;

    const remaining =
        nextTime - Date.now();

    if (remaining <= 0) {
        spinButton.disabled = false;

        nextReward.textContent =
            "Your hourly reward is ready.";

        return;
    }

    spinButton.disabled = true;

    nextReward.textContent =
        `Next reward in ${formatTime(remaining)}`;
}

async function spinWheel() {
    if (spinning || !currentUser) {
        return;
    }

    const banned =
        await checkBanStatus();

    if (banned) {
        return;
    }

    spinning = true;
    spinButton.disabled = true;

    showMessage("");

    const {
        data,
        error
    } = await supabase.rpc(
        "claim_hourly_reward"
    );

    if (error) {
        spinning = false;

        if (
            error.message &&
            error.message
                .toLowerCase()
                .includes("hour")
        ) {
            showMessage(
                "Your hourly reward is not ready yet."
            );

            await loadProfile();

            return;
        }

        spinButton.disabled = false;

        showMessage(
            error.message ||
            "Could not claim reward."
        );

        return;
    }

    const rewardObject =
        Array.isArray(data)
            ? data[0]
            : data;

    const rewardAmount =
        Number(
            rewardObject?.reward ??
            rewardObject?.tokens ??
            0
        );

    if (!Number.isInteger(rewardAmount)) {
        spinning = false;
        spinButton.disabled = false;

        showMessage(
            "Invalid reward received."
        );

        return;
    }

    const closestReward =
        rewards.reduce(
            (closest, value) =>
                Math.abs(value - rewardAmount) <
                Math.abs(closest - rewardAmount)
                    ? value
                    : closest,
            rewards[0]
        );

    const index =
        rewards.indexOf(closestReward);

    const segmentCenter =
        index * 60;

    const targetRotation =
        360 - segmentCenter;

    currentRotation +=
        5 * 360 +
        (
            (
                targetRotation -
                (currentRotation % 360)
            ) + 360
        ) % 360;

    wheel.style.transform =
        `rotate(${currentRotation}deg)`;

    setTimeout(async () => {
        showMessage(
            `You received ${formatNumber(rewardAmount)} tokens.`
        );

        spinning = false;

        await loadProfile();

    }, 4100);
}

logoutButton.addEventListener(
    "click",
    async () => {
        logoutButton.disabled = true;
        logoutButton.textContent =
            "Logging out...";

        const { error } =
            await supabase.auth.signOut({
                scope: "local"
            });

        if (error) {
            logoutButton.disabled = false;
            logoutButton.textContent =
                "Log Out";

            showMessage(
                "Could not log out."
            );

            return;
        }

        window.location.replace(
            "login.html"
        );
    }
);

spinButton.addEventListener(
    "click",
    spinWheel
);

async function start() {
    if (started) {
        return;
    }

    started = true;

    const {
        data: {
            session
        },
        error
    } = await supabase.auth.getSession();

    if (error) {
        loading.textContent =
            "Could not connect to Luckit.";

        return;
    }

    if (!session) {
        window.location.replace(
            "login.html"
        );

        return;
    }

    currentUser =
        session.user;

    const banned =
        await checkBanStatus();

    if (banned) {
        return;
    }

    const loaded =
        await loadProfile();

    if (!loaded) {
        return;
    }

    loading.style.display =
        "none";

    page.style.display =
        "block";

    setInterval(
        async () => {
            if (!currentUser) {
                return;
            }

            const bannedNow =
                await checkBanStatus();

            if (bannedNow) {
                return;
            }

            await loadProfile();
        },
        5000
    );

    setInterval(
        () => {
            if (currentProfile) {
                updateRewardTimer(
                    currentProfile.last_hourly_reward
                );
            }
        },
        1000
    );
}

start();
</script>

</body>
</html>
