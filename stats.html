<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckit Stats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #07552f;
            color: white;
            overflow-x: hidden;
        }

        .clover {
            position: fixed;
            top: -60px;
            width: 35px;
            height: 35px;
            z-index: 0;
            animation: fall linear infinite;
            opacity: 0.55;
            pointer-events: none;
        }

        .clover::before,
        .clover::after {
            content: "";
            position: absolute;
            width: 17px;
            height: 17px;
            background: #42d66b;
            border-radius: 50%;
        }

        .clover::before {
            top: 0;
            left: 9px;
            box-shadow:
                -9px 9px 0 #42d66b,
                9px 9px 0 #42d66b,
                0 18px 0 #42d66b;
        }

        .clover::after {
            width: 4px;
            height: 12px;
            background: #42d66b;
            border-radius: 3px;
            top: 25px;
            left: 16px;
        }

        @keyframes fall {
            0% {
                transform: translateY(-80px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .clover:nth-child(1) {
            left: 5%;
            animation-duration: 8s;
        }

        .clover:nth-child(2) {
            left: 18%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .clover:nth-child(3) {
            left: 32%;
            animation-duration: 9s;
            animation-delay: 4s;
        }

        .clover:nth-child(4) {
            left: 48%;
            animation-duration: 12s;
            animation-delay: 1s;
        }

        .clover:nth-child(5) {
            left: 65%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .clover:nth-child(6) {
            left: 82%;
            animation-duration: 9s;
            animation-delay: 5s;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 40px;
        }

        .username {
            text-align: center;
            font-size: 18px;
            margin-bottom: 28px;
            color: #c4e5cf;
        }

        .hourly-reward {
            text-align: center;
            margin-bottom: 30px;
        }

        #hourlyButton {
            background: #19a94a;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 12px 22px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #hourlyButton:hover {
            background: #20b653;
        }

        #hourlyButton:active {
            transform: translateY(1px);
        }

        #hourlyButton:disabled {
            background: #41634e;
            color: #a9b9ae;
            cursor: not-allowed;
        }

        #hourlyTimer {
            margin-left: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #c4e5cf;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .stat-card {
            background: #0b6b3a;
            border: 1px solid #128047;
            border-radius: 12px;
            padding: 26px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
        }

        .stat-title {
            font-size: 17px;
            margin-bottom: 10px;
            color: #c4e5cf;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
        }

        #wheelOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 24, 14, 0.82);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        #wheelBox {
            width: 390px;
            max-width: calc(100vw - 30px);
            background: #0a4528;
            border: 2px solid #126b3d;
            border-radius: 14px;
            padding: 22px 20px 20px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        #wheelBox h2 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        #wheelSubtitle {
            margin-top: 6px;
            color: #a8d8b9;
            font-size: 14px;
        }

        #wheelContainer {
            position: relative;
            width: 280px;
            height: 310px;
            margin: 18px auto 8px;
        }

        #wheelPointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 28px solid white;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4));
        }

        #wheel {
            position: absolute;
            top: 22px;
            left: 0;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 7px solid #e9f6ed;
            background:
                conic-gradient(
                    #159447 0deg 60deg,
                    #20b257 60deg 120deg,
                    #159447 120deg 180deg,
                    #20b257 180deg 240deg,
                    #159447 240deg 300deg,
                    #20b257 300deg 360deg
                );
            transition:
                transform 5s cubic-bezier(0.15, 0.85, 0.25, 1);
            box-shadow:
                0 4px 0 #06351f,
                0 8px 18px rgba(0, 0, 0, 0.3);
        }

        #wheel::after {
            content: "";
            position: absolute;
            width: 42px;
            height: 42px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #0a4528;
            border: 5px solid white;
            border-radius: 50%;
            z-index: 10;
        }

        #wheelNumbers {
            position: absolute;
            inset: 0;
        }

        #wheelNumbers span {
            position: absolute;
            font-size: 17px;
            font-weight: 700;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        #wheelNumbers span:nth-child(1) {
            top: 32px;
            left: 108px;
        }

        #wheelNumbers span:nth-child(2) {
            top: 83px;
            right: 25px;
        }

        #wheelNumbers span:nth-child(3) {
            bottom: 66px;
            right: 24px;
        }

        #wheelNumbers span:nth-child(4) {
            bottom: 29px;
            left: 104px;
        }

        #wheelNumbers span:nth-child(5) {
            bottom: 66px;
            left: 24px;
        }

        #wheelNumbers span:nth-child(6) {
            top: 83px;
            left: 24px;
        }

        #rewardText {
            display: none;
            margin: 10px 0 14px;
            font-size: 19px;
            font-weight: 700;
        }

        #spinButton {
            width: 100%;
            background: #19a94a;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        #spinButton:hover {
            background: #20b653;
        }

        #spinButton:active {
            transform: translateY(1px);
        }

        #spinButton:disabled {
            background: #41634e;
            color: #a9b9ae;
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 34px;
            }

            #hourlyTimer {
                display: block;
                margin-left: 0;
                margin-top: 10px;
            }
        }

        @media (max-width: 500px) {
            #wheelBox {
                padding: 18px 15px;
            }

            #wheelContainer {
                transform: scale(0.88);
                margin-top: 5px;
                margin-bottom: -25px;
            }
        }
    </style>
</head>

<body>

    <div class="clover"></div>
    <div class="clover"></div>
    <div class="clover"></div>
    <div class="clover"></div>
    <div class="clover"></div>
    <div class="clover"></div>

    <div class="container">

        <h1>Luckit Stats</h1>

        <div class="username">
            Welcome, <span id="username">Player</span>!
        </div>

        <div class="hourly-reward">

            <button id="hourlyButton">
                Hourly Reward
            </button>

            <span id="hourlyTimer">
                Loading...
            </span>

        </div>

        <div class="stats">

            <div class="stat-card">
                <div class="stat-title">Tokens</div>
                <div class="stat-value" id="tokens">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Lucks</div>
                <div class="stat-value" id="lucks">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Packs Opened</div>
                <div class="stat-value" id="packs">0</div>
            </div>

        </div>

    </div>

    <div id="wheelOverlay">

        <div id="wheelBox">

            <h2>Hourly Reward</h2>

            <div id="wheelSubtitle">
                Spin the wheel to collect your tokens
            </div>

            <div id="wheelContainer">

                <div id="wheelPointer"></div>

                <div id="wheel">

                    <div id="wheelNumbers">

                        <span>1000</span>
                        <span>1200</span>
                        <span>1400</span>
                        <span>1600</span>
                        <span>1800</span>
                        <span>2000</span>

                    </div>

                </div>

            </div>

            <div id="rewardText"></div>

            <button id="spinButton">
                SPIN
            </button>

        </div>

    </div>

    <script type="module">

        import {
            createClient
        } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL =
            "https://mjkieyjmdkgvoywwbgcn.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_guhukPTVtX9LVN2JiIwaow_Wvv1BJ2g";

        const supabase =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        const hourlyButton =
            document.getElementById(
                "hourlyButton"
            );

        const wheelOverlay =
            document.getElementById(
                "wheelOverlay"
            );

        const wheel =
            document.getElementById(
                "wheel"
            );

        const spinButton =
            document.getElementById(
                "spinButton"
            );

        const rewardText =
            document.getElementById(
                "rewardText"
            );

        async function loadStats() {

            const {
                data: {
                    user
                }
            } =
                await supabase.auth.getUser();

            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }

            const {
                data,
                error
            } =
                await supabase
                    .from("profiles")
                    .select(
                        "username, tokens, lucks, packs_opened, last_hourly_reward"
                    )
                    .eq("id", user.id)
                    .single();

            if (error) {

                console.error(error);

                return;
            }

            document.getElementById(
                "username"
            ).textContent =
                data.username || "Player";

            document.getElementById(
                "tokens"
            ).textContent =
                data.tokens ?? 0;

            document.getElementById(
                "lucks"
            ).textContent =
                data.lucks ?? 0;

            document.getElementById(
                "packs"
            ).textContent =
                data.packs_opened ?? 0;

            updateHourlyTimer(
                data.last_hourly_reward
            );
        }

        function updateHourlyTimer(
            lastReward
        ) {

            const button =
                document.getElementById(
                    "hourlyButton"
                );

            const timer =
                document.getElementById(
                    "hourlyTimer"
                );

            if (!lastReward) {

                button.disabled =
                    false;

                timer.textContent =
                    "Ready!";

                return;
            }

            const nextReward =
                new Date(
                    lastReward
                ).getTime()
                +
                60 * 60 * 1000;

            const remaining =
                nextReward -
                Date.now();

            if (remaining <= 0) {

                button.disabled =
                    false;

                timer.textContent =
                    "Ready!";

                return;
            }

            button.disabled =
                true;

            const hours =
                Math.floor(
                    remaining /
                    (1000 * 60 * 60)
                );

            const minutes =
                Math.floor(
                    (
                        remaining %
                        (1000 * 60 * 60)
                    ) /
                    (1000 * 60)
                );

            const seconds =
                Math.floor(
                    (
                        remaining %
                        (1000 * 60)
                    ) /
                    1000
                );

            timer.textContent =
                `${hours}h ${minutes}m ${seconds}s`;

            setTimeout(
                () => {
                    updateHourlyTimer(
                        lastReward
                    );
                },
                1000
            );
        }

        hourlyButton.addEventListener(
            "click",
            async () => {

                hourlyButton.disabled =
                    true;

                hourlyButton.textContent =
                    "Claiming...";

                const {
                    data: reward,
                    error
                } =
                    await supabase.rpc(
                        "claim_hourly_reward"
                    );

                if (error) {

                    console.error(
                        error
                    );

                    alert(
                        error.message
                    );

                    hourlyButton.textContent =
                        "Hourly Reward";

                    await loadStats();

                    return;
                }

                const rewardAmount =
                    Number(
                        reward.reward
                    );

                wheel.style.transition =
                    "none";

                wheel.style.transform =
                    "rotate(0deg)";

                void wheel.offsetWidth;

                wheel.style.transition =
                    "transform 5s cubic-bezier(0.15, 0.85, 0.25, 1)";

                rewardText.style.display =
                    "none";

                rewardText.textContent =
                    "";

                wheelOverlay.style.display =
                    "flex";

                spinButton.disabled =
                    false;

                spinButton.textContent =
                    "SPIN";

                spinButton.onclick =
                    () => {

                        spinButton.disabled =
                            true;

                        spinButton.textContent =
                            "SPINNING...";

                        const values = [
                            1000,
                            1200,
                            1400,
                            1600,
                            1800,
                            2000
                        ];

                        let closestIndex =
                            0;

                        let closestDifference =
                            Infinity;

                        for (
                            let i = 0;
                            i < values.length;
                            i++
                        ) {

                            const difference =
                                Math.abs(
                                    rewardAmount -
                                    values[i]
                                );

                            if (
                                difference <
                                closestDifference
                            ) {

                                closestDifference =
                                    difference;

                                closestIndex =
                                    i;
                            }
                        }

                        const sectionSize =
                            360 /
                            values.length;

                        const targetAngle =
                            closestIndex *
                            sectionSize +
                            sectionSize / 2;

                        const rotations =
                            5;

                        const finalRotation =
                            rotations * 360 +
                            (360 - targetAngle);

                        wheel.style.transform =
                            `rotate(${finalRotation}deg)`;

                        setTimeout(
                            () => {

                                rewardText.textContent =
                                    `You got ${rewardAmount.toLocaleString()} Tokens!`;

                                rewardText.style.display =
                                    "block";

                                spinButton.textContent =
                                    "DONE";

                                setTimeout(
                                    () => {

                                        wheelOverlay
                                            .style
                                            .display =
                                            "none";

                                        hourlyButton
                                            .textContent =
                                            "Hourly Reward";

                                        loadStats();

                                    },
                                    1800
                                );

                            },
                            5200
                        );
                    };
            }
        );

        loadStats();

    </script>

</body>
</html>
