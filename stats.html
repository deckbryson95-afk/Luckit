<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckit Stats</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07552f;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .clover {
            position: fixed;
            top: -50px;
            width: 30px;
            height: 30px;
            animation: fall linear infinite;
            opacity: 0.25;
            z-index: 0;
        }

        .leaf {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #d9eee3;
            border-radius: 50%;
        }

        .leaf:nth-child(1) {
            top: 0;
            left: 7px;
        }

        .leaf:nth-child(2) {
            top: 7px;
            left: 0;
        }

        .leaf:nth-child(3) {
            top: 7px;
            right: 0;
        }

        .leaf:nth-child(4) {
            bottom: 0;
            left: 7px;
        }

        .stem {
            position: absolute;
            width: 3px;
            height: 12px;
            background: #d9eee3;
            left: 14px;
            top: 17px;
            transform: rotate(25deg);
            transform-origin: top;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .clover:nth-child(1) {
            left: 5%;
            animation-duration: 9s;
        }

        .clover:nth-child(2) {
            left: 18%;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .clover:nth-child(3) {
            left: 32%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .clover:nth-child(4) {
            left: 48%;
            animation-duration: 13s;
            animation-delay: 1s;
        }

        .clover:nth-child(5) {
            left: 65%;
            animation-duration: 11s;
            animation-delay: 3s;
        }

        .clover:nth-child(6) {
            left: 82%;
            animation-duration: 14s;
            animation-delay: 5s;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 900px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 60px 0 35px;
            display: flex;
            flex-direction: column;
        }

        .profile {
            background: #0b6b3a;
            border-radius: 14px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            background: #07552f;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .username {
            font-size: 25px;
            font-weight: bold;
            color: #e8f5ec;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .stat-card {
            background: #0b6b3a;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .stat-title {
            font-size: 16px;
            font-weight: 600;
            color: #d9eee3;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .logout {
            margin-top: auto;
            padding-top: 50px;
        }

        .logout-btn {
    width: 400px;
    height: 44px;
    padding: 0;
    margin: 24px auto 0;
    display: block;
    border: none;
    border-radius: 10px;
    background: #0b6b3a;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.logout-btn:hover {
    background: #0d7a43;
}

        .logout button:hover {
            background: #0d7942;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="page">

        <div class="profile">
            <div class="avatar" id="avatar">U</div>
            <div class="username" id="username">Loading...</div>
        </div>

        <div class="stats">

            <div class="stat-card">
                <div class="stat-title">Lucks</div>
                <div class="stat-value" id="lucks">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Blooks Unlocked</div>
                <div class="stat-value" id="blooks">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Packs Opened</div>
                <div class="stat-value" id="packs">0</div>
            </div>

        </div>

        <div class="logout">
            <button id="logoutButton">Log Out</button>
        </div>

    </div>

    <script type="module">

        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://mmrvamxpqqsozijrrnlx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_5rSQewEmqfaEDleTv93jIw_A_dUBT1Q";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function loadProfile() {

            const {
                data: {
                    user
                }
            } = await supabase.auth.getUser();

            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const { data, error } = await supabase
                .from("profiles")
                .select("username, lucks, blooks_unlocked, packs_opened")
                .eq("id", user.id)
                .single();

            if (error || !data) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("username").textContent =
                data.username;

            document.getElementById("avatar").textContent =
                data.username.charAt(0).toUpperCase();

            document.getElementById("lucks").textContent =
                data.lucks;

            document.getElementById("blooks").textContent =
                data.blooks_unlocked;

            document.getElementById("packs").textContent =
                data.packs_opened;
        }

        document
            .getElementById("logoutButton")
            .addEventListener("click", async function() {

                await supabase.auth.signOut();

                window.location.href = "login.html";
            });

        loadProfile();

    </script>

</body>
</html>
