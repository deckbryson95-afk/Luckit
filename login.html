<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luckit Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07552f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .clover {
            position: fixed;
            top: -50px;
            width: 30px;
            height: 30px;
            animation: fall linear infinite;
            opacity: 0.25;
        }

        .leaf {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #d9eee3;
            border-radius: 50%;
        }

        .leaf:nth-child(1) {
            top: 0;
            left: 7px;
        }

        .leaf:nth-child(2) {
            top: 7px;
            left: 0;
        }

        .leaf:nth-child(3) {
            top: 7px;
            right: 0;
        }

        .leaf:nth-child(4) {
            bottom: 0;
            left: 7px;
        }

        .stem {
            position: absolute;
            width: 3px;
            height: 12px;
            background: #d9eee3;
            left: 14px;
            top: 17px;
            transform: rotate(25deg);
            transform-origin: top;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .clover:nth-child(1) {
            left: 5%;
            animation-duration: 9s;
        }

        .clover:nth-child(2) {
            left: 25%;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .clover:nth-child(3) {
            left: 50%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .clover:nth-child(4) {
            left: 75%;
            animation-duration: 13s;
            animation-delay: 1s;
        }

        .box {
            width: 90%;
            max-width: 400px;
            background: #0b6b3a;
            border-radius: 14px;
            padding: 35px;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 14px;
            background: #07552f;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #063f24;
        }

        .message {
            color: #d9eee3;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="clover">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="stem"></div>
    </div>

    <div class="box">

        <h1>Luckit</h1>

        <form id="loginForm">

            <input
                id="username"
                type="text"
                placeholder="Username"
                maxlength="20"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                minlength="6"
                required
            >

            <button type="submit">Log In</button>

        </form>

        <div class="message" id="message"></div>

        <div class="signup">
            <a href="signup.html">Create an account</a>
        </div>

    </div>

    <script type="module">

        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://mmrvamxpqqsozijrrnlx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_5rSQewEmqfaEDleTv93jIw_A_dUBT1Q";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const username = document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();

            const password = document
                .getElementById("password")
                .value;

            message.textContent = "Logging in...";

            const email = username + "@lucklit.local";

            const { error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = "Invalid username or password.";
                return;
            }

            window.location.href = "stats.html";
        });

    </script>

</body>
</html>
